name: Local acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: ${{ matrix.os }} / ${{ matrix.mode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            mode: Fast
          - os: windows-2025
            mode: Fast
          - os: ubuntu-24.04
            mode: Container
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CI: 'true'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - name: Install pinned Aspire CLI
        run: dotnet tool install --global Aspire.Cli --version 13.5.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Check Docker availability
        if: matrix.mode == 'Container'
        run: docker info
      - name: Pack local packages and template
        run: bun run prepare:local
      - name: Type check
        run: bun run check
      - name: TypeScript contracts
        run: bun test ./spikes/compatibility ./src/alchemy ./scripts/local-mode.test.ts ./scripts/release-policy.test.ts ./scripts/acceptance-diagnostics.test.ts ./scripts/package-process.test.ts ./scripts/cloud-acceptance.test.ts ./scripts/e2e-process.test.ts
      - name: .NET contracts
        run: dotnet test Flarestack.slnx --no-restore
      - name: Template generation contracts
        run: bun run test:template
      - name: Generated application acceptance and telemetry
        env:
          FLARESTACK_TEST_MODE: ${{ matrix.mode }}
          FLARESTACK_ACCEPTANCE_SUMMARY: ${{ runner.temp }}/acceptance-failure-summary.json
        run: bun run test:acceptance
      - name: Upload sanitized acceptance failure summary
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: acceptance-failure-${{ matrix.os }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/acceptance-failure-summary.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop repository AppHost if needed
        if: always()
        continue-on-error: true
        run: aspire stop --non-interactive
